[package]
name = "yajlish-schema-macros"
version = "0.1.0"
description = "Proc macro for yajlish-schema: generates a yajlish Handler from JSON Schemas"
keywords = ["json", "json-schema", "streaming", "validation"]
categories = ["parsing"]
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", optional = true }
syn = { version = "2", features = ["full"] }

[features]
# Accept the `pattern` keyword (the runtime then needs `regex`).
pattern = ["dep:regex"]
# Derive serde's Serialize and Deserialize on generated types.
serde = []
