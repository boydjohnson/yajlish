[workspace]
members = [".", "yajlish-ndjson"]

[workspace.package]
authors = ["Boyd Johnson <johnson.boyd@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/boydjohnson/yajlish"
edition = "2018"

[workspace.dependencies]
pretty_assertions = "^0.6"
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[package]
name = "yajlish"
version = "0.5.0"
description = "An event-based json parser"
keywords = ["json", "parser", "event-based"]
categories = ["parsing"]
documentation = "https://docs.rs/yajlish"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
logos = "0.16"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
pretty_assertions.workspace = true
proptest.workspace = true
serde_json.workspace = true
# The previous release, built on json-tools, to compare against in benches/.
yajlish_04 = { package = "yajlish", version = "0.4" }

[[bench]]
name = "parse"
harness = false
