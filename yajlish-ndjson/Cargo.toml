[package]
name = "yajlish-ndjson"
version = "0.1.0"
description = "Convert a JSON array inside a JSON document into newline-delimited JSON, streaming"
keywords = ["json", "ndjson", "streaming"]
categories = ["parsing"]
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
yajlish = { path = "..", version = "0.5" }

[dev-dependencies]
bolero = "0.13.7"
pretty_assertions.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints.rust]
# CI builds with RUSTFLAGS=-Dwarnings, and rustc's check-cfg warns on unknown
# cfgs. `kani` is set by `cargo kani`, `fuzzing` by `cargo bolero`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(fuzzing)"] }
