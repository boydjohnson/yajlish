[package]
name = "yajlish-schema"
version = "0.1.0"
description = "Validate and build typed values from a JSON stream against JSON Schemas, with a generated yajlish Handler"
keywords = ["json", "json-schema", "streaming", "validation"]
categories = ["parsing"]
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"

[dependencies]
yajlish = { path = "..", version = "0.5" }
yajlish-schema-macros = { path = "../yajlish-schema-macros", version = "0.1" }
regex = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

[features]
# Support the `pattern` keyword.
pattern = ["dep:regex", "yajlish-schema-macros/pattern"]
# Derive Serialize and Deserialize on generated types.
serde = ["dep:serde", "yajlish-schema-macros/serde"]

[dev-dependencies]
# The workspace README's examples run as doctests of this crate.
yajlish-ndjson = { path = "../yajlish-ndjson" }
bolero = "0.13.7"
criterion = { version = "0.5", default-features = false }
pretty_assertions.workspace = true
proptest.workspace = true
serde_json.workspace = true
regex = "1"
jsonschema = { version = "0.59", default-features = false }

[lints.rust]
# CI builds with RUSTFLAGS=-Dwarnings, and rustc's check-cfg warns on unknown
# cfgs. `kani` is set by `cargo kani`, `fuzzing` by `cargo bolero`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(fuzzing)"] }

[[bench]]
name = "candidates"
harness = false
